<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 55 385 90" width="385" height="90">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7EC8"/>
      <stop offset="100%" style="stop-color:#6B5CA5"/>
    </linearGradient>
    <radialGradient id="neuronGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B7EC8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#6B5CA5;stop-opacity:0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="50" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="700" fill="url(#brandGrad)" letter-spacing="0">
    B
  </text>

  <circle cx="82" cy="88" r="2.5" fill="#8B7EC8" opacity="0.6"/>
  <circle cx="95" cy="78" r="2" fill="#6B5CA5" opacity="0.4"/>
  <circle cx="82" cy="118" r="2.5" fill="#7A6DB7" opacity="0.5"/>
  <circle cx="97" cy="128" r="2" fill="#6B5CA5" opacity="0.4"/>

  <line x1="82" y1="88" x2="95" y2="78" stroke="#8B7EC8" stroke-width="0.8" opacity="0.4"/>
  <line x1="82" y1="88" x2="82" y2="118" stroke="#7A6DB7" stroke-width="0.8" opacity="0.3"/>
  <line x1="82" y1="118" x2="97" y2="128" stroke="#6B5CA5" stroke-width="0.8" opacity="0.4"/>

  <text x="108" y="135" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="400" fill="#2C2C34" letter-spacing="-1">
    eronica
  </text>

  <circle cx="295" cy="73" r="5" fill="url(#neuronGlow)" filter="url(#softGlow)"/>
  <circle cx="295" cy="73" r="3" fill="#8B7EC8"/>

  <line x1="295" y1="78" x2="295" y2="87" stroke="#8B7EC8" stroke-width="1" opacity="0.25"
        stroke-dasharray="2,2"/>

  <line x1="95" y1="78" x2="295" y2="73" stroke="url(#brandGrad)" stroke-width="0.6" opacity="0.12"/>
  <line x1="82" y1="88" x2="295" y2="73" stroke="#8B7EC8" stroke-width="0.5" opacity="0.08"/>

  <circle cx="197" cy="76" r="1.5" fill="#7A6DB7" opacity="0.2"/>
</svg>
